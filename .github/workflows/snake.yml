name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Rosa-SDev
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=F472B6&color_dots=#161b22,#4c0519,#831843,#BE185D,#EC4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=EC4899&color_dots=#161b22,#4c0519,#831843,#BE185D,#F472B6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
